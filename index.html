<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carmen - Mi Universo</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header wrap">
  <span class="eyebrow">Mi Universo</span>
  <h1>El universo de Carmen</h1>
  <p>Un mapa de las cosas que me interesan y en las que estoy creciendo. Cada
  planeta es un mundo por explorar — con el tiempo iré llenando cada uno.</p>
</header>

<section class="orbit-section wrap">
  <figure class="orbit-figure">
    <svg viewBox="0 0 600 600">
      <circle class="orbit-ring" cx="300" cy="300" r="220"/>

      <line class="orbit-line" x1="300" y1="300" x2="300" y2="80"/>
      <line class="orbit-line" x1="300" y1="300" x2="491" y2="190"/>
      <line class="orbit-line" x1="300" y1="300" x2="491" y2="410"/>
      <line class="orbit-line" x1="300" y1="300" x2="300" y2="520"/>
      <line class="orbit-line" x1="300" y1="300" x2="109" y2="410"/>
      <line class="orbit-line" x1="300" y1="300" x2="109" y2="190"/>

      <g class="node-sun">
        <circle cx="300" cy="300" r="82"/>
        <text x="300" y="308" text-anchor="middle" font-size="24">Carmen</text>
      </g>

      <a class="orbit-node" href="matematicas.html">
        <circle cx="300" cy="80" r="58" fill="var(--c-matematicas)"/>
        <text x="300" y="90" text-anchor="middle" font-size="30">📐</text>
        <text class="node-label-out" x="300" y="156" text-anchor="middle">Matemáticas</text>
      </a>

      <a class="orbit-node" href="musica.html">
        <circle cx="491" cy="190" r="58" fill="var(--c-musica)"/>
        <text x="491" y="200" text-anchor="middle" font-size="30">🎵</text>
        <text class="node-label-out" x="491" y="266" text-anchor="middle">Música</text>
      </a>

      <a class="orbit-node" href="lectura.html">
        <circle cx="491" cy="410" r="58" fill="var(--c-lectura)"/>
        <text x="491" y="420" text-anchor="middle" font-size="30">📖</text>
        <text class="node-label-out" x="491" y="486" text-anchor="middle">Lectura</text>
      </a>

      <a class="orbit-node" href="nutricion.html">
        <circle cx="300" cy="520" r="58" fill="var(--c-nutricion)"/>
        <text x="300" y="530" text-anchor="middle" font-size="30">🥗</text>
        <text class="node-label-out" x="300" y="596" text-anchor="middle">Nutrición</text>
      </a>

      <a class="orbit-node" href="salud.html">
        <circle cx="109" cy="410" r="58" fill="var(--c-salud)"/>
        <text x="109" y="420" text-anchor="middle" font-size="30">🌱</text>
        <text class="node-label-out" x="109" y="486" text-anchor="middle">Salud</text>
      </a>

      <a class="orbit-node" href="zhineng-qigong.html">
        <circle cx="109" cy="190" r="58" fill="var(--c-qigong)"/>
        <text x="109" y="200" text-anchor="middle" font-size="30">🌀</text>
        <text class="node-label-out" x="109" y="266" text-anchor="middle">Zhineng Qigong</text>
      </a>
    </svg>
  </figure>
</section>

<footer class="site-footer wrap">
  Mi Universo · un mapa que va creciendo poco a poco
</footer>

</body>
</html>
