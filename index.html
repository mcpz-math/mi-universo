<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carmen - Mi Universo</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header wrap">
  <span class="eyebrow">Mi Universo</span>
  <h1>El universo de Carmen</h1>
  <p>Un mapa de las cosas que me interesan y en las que estoy creciendo. Cada
  planeta es un mundo por explorar — con el tiempo iré llenando cada uno.</p>
</header>

<section class="orbit-section wrap">
  <figure class="orbit-figure">
    <svg viewBox="0 0 600 600">
      <line class="orbit-line" x1="300" y1="300" x2="300" y2="80"/>
      <line class="orbit-line" x1="300" y1="300" x2="509" y2="232"/>
      <line class="orbit-line" x1="300" y1="300" x2="429" y2="478"/>
      <line class="orbit-line" x1="300" y1="300" x2="171" y2="478"/>
      <line class="orbit-line" x1="300" y1="300" x2="91" y2="232"/>

      <g class="node-sun">
        <circle cx="300" cy="300" r="82"/>
        <text x="300" y="308" text-anchor="middle" font-size="24">Carmen</text>
      </g>

      <a class="orbit-node" href="matematicas.html">
        <circle cx="300" cy="80" r="58" fill="var(--c-matematicas)"/>
        <text x="300" y="90" text-anchor="middle" font-size="30">📐</text>
        <text class="node-label-out" x="300" y="156" text-anchor="middle">Matemáticas</text>
      </a>

      <a class="orbit-node" href="lectura.html">
        <circle cx="509" cy="232" r="58" fill="var(--c-lectura)"/>
        <text x="509" y="242" text-anchor="middle" font-size="30">📖</text>
        <text class="node-label-out" x="509" y="308" text-anchor="middle">Lectura</text>
      </a>

      <a class="orbit-node" href="nutricion.html">
        <circle cx="429" cy="478" r="58" fill="var(--c-nutricion)"/>
        <text x="429" y="488" text-anchor="middle" font-size="30">🥗</text>
        <text class="node-label-out" x="429" y="554" text-anchor="middle">Nutrición</text>
      </a>

      <a class="orbit-node" href="salud.html">
        <circle cx="171" cy="478" r="58" fill="var(--c-salud)"/>
        <text x="171" y="488" text-anchor="middle" font-size="30">🌱</text>
        <text class="node-label-out" x="171" y="554" text-anchor="middle">Salud</text>
      </a>

      <a class="orbit-node" href="zhineng-qigong.html">
        <circle cx="91" cy="232" r="58" fill="var(--c-qigong)"/>
        <text x="91" y="242" text-anchor="middle" font-size="30">🌀</text>
        <text class="node-label-out" x="91" y="308" text-anchor="middle">Zhineng Qigong</text>
      </a>
    </svg>
  </figure>
</section>

<footer class="site-footer wrap">
  Mi Universo · un mapa que va creciendo poco a poco
</footer>

</body>
</html>
